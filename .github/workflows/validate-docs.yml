# Modified to follow linear build pattern from PH Core IG

name: Build PH eReferral FHIR IG

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"

          # Check for forward slash
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains '/'. Use hyphens instead."
            exit 1
          fi

          # Check for other invalid characters
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters."
            exit 1
          fi

          echo "✅ Branch name validation passed"

      - uses: actions/checkout@v4

      - name: Show checked out commit
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          sudo gem install jekyll
          sudo npm install -g fsh-sushi

      - name: Build IG
        run: |
          chmod +x ./_updatePublisher.sh
          ./_updatePublisher.sh -y
          chmod +x ./_genonce.sh
          ./_genonce.sh

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-qa
          path: |
            output/qa.json
            output/qa.html

      - name: Copy publisher log into workspace
        if: always()
        run: |
          if [ -f /tmp/fhir-ig-publisher-tmp.log ]; then
            cp /tmp/fhir-ig-publisher-tmp.log output/fhir-ig-publisher-tmp.log
          fi

      - name: Upload publisher log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-publisher-log
          path: output/fhir-ig-publisher-tmp.log

      - name: Print QA error summary and details from qa.html
        if: always()
        run: |
          if [ ! -f output/qa.html ]; then
            echo "::warning::output/qa.html not found"
            exit 0
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path
          from html import unescape

          html = Path("output/qa.html").read_text(encoding="utf-8", errors="ignore")

          def clean(s):
              s = re.sub(r"<.*?>", "", s, flags=re.S)
              s = unescape(s)
              return " ".join(s.split()).strip()

          # 1) Extract rows from the summary table
          rows = re.findall(r"<tr.*?>(.*?)</tr>", html, flags=re.S | re.I)
          failing = []

          for row in rows:
              cols = re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", row, flags=re.S | re.I)
              cols = [clean(c) for c in cols]
              if len(cols) >= 4:
                  filename, errors, warnings, hints = cols[:4]
                  if errors.isdigit() and int(errors) > 0 and filename != "Build Errors":
                      failing.append((filename, int(errors), warnings, hints))

          print("---- QA failing rows ----")
          if not failing:
              print("No failing rows found")
          else:
              for filename, errors, warnings, hints in failing:
                  print(f"- {filename}: errors={errors}, warnings={warnings}, hints={hints}")

          # 2) Try to find detailed error blocks related to each failing file/resource
          print("---- QA detailed errors ----")
          for filename, errors, warnings, hints in failing:
              short = filename.split("/")[-1]
              print(f"\n### {short}")

              # Heuristic: find nearby sections mentioning the filename/resource
              # and capture list items / paragraphs / table rows after it.
              pattern = re.compile(
                  rf"({re.escape(short)}.*?)(?=<h[1-6]\b|<hr\b|$)",
                  flags=re.S | re.I
              )
              matches = pattern.findall(html)

              printed = False
              for block in matches[:3]:
                  text = clean(block)
                  if text and len(text) > len(short):
                      print(text[:4000])
                      printed = True
                      break

              if not printed:
                  print("No detailed section found by heuristic parsing; inspect qa.html artifact.")
          PY
            - name: QA Gate
              run: |
                if [ -f output/qa.json ]; then
                  ERRORS=$(jq -r '.errs // 0' output/qa.json)
                  if [ "$ERRORS" -gt 0 ]; then
                    echo "::error::QA errors found: $ERRORS"
                    exit 1
                  fi
                  echo "✅ QA passed: $ERRORS errors"
                else
                  echo "::warning::No qa.json found"
                fi

      - name: Deploy to GitHub Pages
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
          force_orphan:  true
          commit_message: "Deploy IG - ${{ github.sha }}"
