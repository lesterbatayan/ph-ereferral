# Modified to follow linear build pattern from PH Core IG

name: Build PH eReferral FHIR IG

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"

          # Check for forward slash
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains '/'. Use hyphens instead."
            exit 1
          fi

          # Check for other invalid characters
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters."
            exit 1
          fi

          echo "✅ Branch name validation passed"

      - uses: actions/checkout@v4

      - name: Show checked out commit
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          sudo gem install jekyll
          sudo npm install -g fsh-sushi

      - name: Build IG
        run: |
          chmod +x ./_updatePublisher.sh
          ./_updatePublisher.sh -y
          chmod +x ./_genonce.sh
          ./_genonce.sh

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-qa
          path: |
            output/qa.json
            output/qa.html

      - name: Copy publisher log into workspace
        if: always()
        run: |
          if [ -f /tmp/fhir-ig-publisher-tmp.log ]; then
            cp /tmp/fhir-ig-publisher-tmp.log output/fhir-ig-publisher-tmp.log
          fi

      - name: Upload publisher log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-publisher-log
          path: output/fhir-ig-publisher-tmp.log

      - name: Print QA error summary and details from qa.html
        if: always()
        run: |
          if [ ! -f output/qa.html ]; then
            echo "::warning::output/qa.html not found"
            exit 0
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path
          from html import unescape

          html = Path("output/qa.html").read_text(encoding="utf-8", errors="ignore")

          def clean(text: str) -> str:
              text = re.sub(r"<.*?>", "", text, flags=re.S)
              text = unescape(text)
              return " ".join(text.split()).strip()

          def extract_table_rows(fragment: str):
              rows = []
              for tr in re.findall(r"<tr[^>]*>(.*?)</tr>", fragment, flags=re.S | re.I):
                  cols = re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", tr, flags=re.S | re.I)
                  cols = [clean(c) for c in cols]
                  if cols:
                      rows.append(cols)
              return rows

          # 1) Extract failing rows from the summary table
          failing = []
          for cols in extract_table_rows(html):
              if len(cols) >= 4:
                  filename, errors, warnings, hints = cols[:4]
                  if filename != "Build Errors" and errors.isdigit() and int(errors) > 0:
                      failing.append((filename, int(errors), warnings, hints))

          print("---- QA failing rows ----")
          if not failing:
              print("No failing rows found")
          else:
              for filename, errors, warnings, hints in failing:
                  print(f"- {filename}: errors={errors}, warnings={warnings}, hints={hints}")

          # 2) Extract actual validation messages for each failing resource
          print("---- QA detailed errors ----")
          for filename, errors, warnings, hints in failing:
              short = filename.split("/")[-1]
              print(f"\n### {short}")

              section_match = re.search(
                  rf'(<a[^>]*name="{re.escape(short)}(?:\.json)?".*?)(?=<a[^>]*name="|<h[1-6]\b|$)',
                  html,
                  flags=re.S | re.I,
              )

              if not section_match:
                  section_match = re.search(
                      rf'({re.escape(filename)}(?:\.json)?.*?)(?=<a[^>]*name="|<h[1-6]\b|$)',
                      html,
                      flags=re.S | re.I,
                  )

              if not section_match:
                  print("No detailed section found; inspect qa.html artifact.")
                  continue

              section = section_match.group(1)
              rows = extract_table_rows(section)

              details = []
              for cols in rows:
                  if len(cols) >= 4 and cols[0] != "Path":
                      path, severity, message, validating = cols[:4]
                      sev = severity.lower()
                      if sev in {"error", "warning", "information"}:
                          details.append((path, severity, message, validating))

              if not details:
                  print("No structured validation rows found; inspect qa.html artifact.")
                  continue

              for path, severity, message, validating in details:
                  print(f"- [{severity}] {path}: {message} (Validating: {validating})")
          PY

      - name: QA Gate
        run: |
          if [ -f output/qa.json ]; then
            ERRORS=$(jq -r '.errs // 0' output/qa.json)
            if [ "$ERRORS" -gt 0 ]; then
              echo "::error::QA errors found: $ERRORS"
              exit 1
            fi
            echo "✅ QA passed: $ERRORS errors"
          else
            echo "::warning::No qa.json found"
          fi

      - name: Deploy to GitHub Pages
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
          force_orphan:  true
          commit_message: "Deploy IG - ${{ github.sha }}"
